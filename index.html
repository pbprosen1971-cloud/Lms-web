<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mcq job Exam Portal -সরকারি চাকরি পরিক্ষার প্রস্তুতি নিন আজ থেকেই</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Google Identity Services for client-side OAuth -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Google reCAPTCHA v2 API with explicit onload handler -->
    <script>
      window.onRecaptchaLoad = function() {
        window.__recaptchaLoaded = true;
        window.dispatchEvent(new Event('recaptcha-ready'));
      };
    </script>
    <script src="https://www.google.com/recaptcha/api.js?onload=onRecaptchaLoad&render=explicit" async defer></script>
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          if (originalFetch) {
            var _fetchVal = originalFetch;
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return _fetchVal;
              },
              set: function(val) {
                _fetchVal = val;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          console.warn('Fetch setter patch error:', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
